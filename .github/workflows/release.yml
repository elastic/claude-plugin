name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Validate version input
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$INPUT_VERSION' is not valid semver (expected X.Y.Z)"
            exit 1
          fi

      - name: Check version is a logical bump
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          current=$(git show origin/stable:.claude-plugin/plugin.json | jq -r '.version')
          echo "Current version (stable): $current"
          echo "Target version:  $INPUT_VERSION"

          IFS='.' read -r cur_major cur_minor cur_patch <<< "$current"
          IFS='.' read -r new_major new_minor new_patch <<< "$INPUT_VERSION"

          valid=false

          # Major bump: X+1.0.0
          if [ "$new_major" -eq $((cur_major + 1)) ] && [ "$new_minor" -eq 0 ] && [ "$new_patch" -eq 0 ]; then
            valid=true
          fi

          # Minor bump: X.Y+1.0
          if [ "$new_major" -eq "$cur_major" ] && [ "$new_minor" -eq $((cur_minor + 1)) ] && [ "$new_patch" -eq 0 ]; then
            valid=true
          fi

          # Patch bump: X.Y.Z+1
          if [ "$new_major" -eq "$cur_major" ] && [ "$new_minor" -eq "$cur_minor" ] && [ "$new_patch" -eq $((cur_patch + 1)) ]; then
            valid=true
          fi

          if [ "$valid" != "true" ]; then
            echo "::error::Version '$INPUT_VERSION' is not a single logical bump from '$current'. Expected one of: $cur_major.$cur_minor.$((cur_patch + 1)), $cur_major.$((cur_minor + 1)).0, or $((cur_major + 1)).0.0"
            exit 1
          fi

      - name: Check tag does not already exist
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          name=$(jq -r '.name' .claude-plugin/plugin.json)
          tag="${name}--v${INPUT_VERSION}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag '$tag' already exists"
            exit 1
          fi

      # Installs the Claude Code CLI pinned in package.json devDependencies.
      # This has to run before the release branch is cut, because cutting it
      # removes package.json and the lockfile.
      - name: Install dependencies
        run: npm ci

      # Commits the version bump and changelog stamp, then removes
      # package.json and package-lock.json so they never reach stable.
      - name: Cut release branch
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/cut-release-branch.sh "$INPUT_VERSION"

      - name: Validate stripped plugin
        run: ./node_modules/.bin/claude plugin validate --strict .

      - name: Test hooks on stripped plugin
        run: ./node_modules/.bin/claude plugin test .

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          branch="automation/release-v${INPUT_VERSION}"
          git push origin "$branch"

          gh pr create \
            --base stable \
            --head "$branch" \
            --title "release: v${INPUT_VERSION}" \
            --body "Automated release PR for v${INPUT_VERSION}. Merging this will update the published plugin. Merge with a merge commit; do not squash or rebase." \
            --label "skip-changelog"

          # No auto-merge here. A merge that GITHUB_TOKEN sets up pushes to
          # stable without starting other workflows, so Tag Release and
          # Backport Release would never run. A maintainer merges this PR.
