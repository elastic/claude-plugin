name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  validate:
    name: Plugin Validation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      # Claude Code CLI is pinned in package.json devDependencies so validator
      # changes arrive as reviewable Renovate PRs instead of breaking main.
      - name: Validate plugin
        run: npm run validate

      - name: Test hooks
        run: npm run test:hooks
