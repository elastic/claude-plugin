name: Generate skills list

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-plugin/plugin.json'
      - 'scripts/generate-skills-list.sh'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Update plugin.json skills array
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate skills list
        run: bash scripts/generate-skills-list.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet .claude-plugin/plugin.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated plugin.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git commit -m "chore: regenerate plugin.json skills list"
          git push

  check-fork:
    name: Validate plugin.json skills array (Fork)
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate skills list and check for drift
        run: |
          cp .claude-plugin/plugin.json .claude-plugin/plugin.json.before
          bash scripts/generate-skills-list.sh
          if ! diff -q .claude-plugin/plugin.json.before .claude-plugin/plugin.json > /dev/null 2>&1; then
            echo "::error::The skills array in plugin.json is out of date."
            echo ""
            echo "For branches on this repo, plugin.json is auto-updated."
            echo "Since this PR is from a fork, please regenerate it manually:"
            echo ""
            echo "  bash scripts/generate-skills-list.sh"
            echo ""
            echo "Then commit the updated .claude-plugin/plugin.json."
            exit 1
          fi
          echo "plugin.json skills array is up to date."
