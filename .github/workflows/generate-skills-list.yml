name: Generate skills list

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-plugin/plugin.json'
      - 'scripts/generate-skills-list.sh'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Update plugin.json skills array
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate skills list
        run: bash scripts/generate-skills-list.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet .claude-plugin/plugin.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated plugin.json
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
          && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git commit -m "chore: regenerate plugin.json skills list"
          git push

      - name: Require up-to-date plugin.json for fork PRs
        if: >-
          github.event.pull_request.head.repo.full_name != github.repository
          && steps.diff.outputs.changed == 'true'
        run: |
          echo "::error::The skills array in plugin.json is out of date."
          echo ""
          echo "For branches on this repo, plugin.json is auto-updated."
          echo "Since this PR is from a fork, please regenerate it manually:"
          echo ""
          echo "  bash scripts/generate-skills-list.sh"
          echo ""
          echo "Then commit the updated .claude-plugin/plugin.json."
          exit 1
